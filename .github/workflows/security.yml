name: Security

# Known-vulnerability and workflow-hardening checks. The weekly run matters:
# new advisories land against unchanged code, so a quiet repo still needs a
# re-scan. A failed scheduled run emails whoever last edited the cron line.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same toolchain line as ci.yml and release.yml, so standard-library
      # advisories are checked against what actually ships.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      # Reachability-aware: only fails when our code calls a vulnerable symbol.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Audits .github/ (workflows + dependabot.yml) for unpinned actions,
      # excessive permissions, template injection, credential persistence.
      # The token enables the online audits (known-vulnerable actions,
      # impostor commits).
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --format=github .github/

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      # The extension has no runtime deps, so this covers the build toolchain
      # (typescript, type packages) that runs in CI and on release.
      - name: npm audit
        run: npm audit --audit-level=moderate
