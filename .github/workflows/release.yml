name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # goreleaser publishes through the GitHub API with explicit tokens, so
      # the checkout doesn't need to leave git credentials on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No module/build cache: release binaries are built from a clean slate
      # rather than from a cache another workflow run could have written.
      # check-latest: without it "1.26" means whatever patch the runner image
      # has cached, which lagged the newest one (v0.21.3 shipped on 1.26.8).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false

      - name: Install Syft for release SBOMs
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Read release notes
        id: notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES<<EOF" >> "$GITHUB_ENV"
            cat RELEASE_NOTES.md >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          else
            echo "RELEASE_NOTES=Release ${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
